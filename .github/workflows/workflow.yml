name: Main Workflow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ci:
    name: stage-1-ci
    runs-on: ubuntu-latest

    steps:
      - name: checkout rep
        uses: actions/checkout@v4

      - name: set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: linter-test
        run: npm run lint

      - name: base-test
        run: npm run test

      - name: build
        run: npm run build

      - name: artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist
          retention-days: 3

  security:
    name: stage-2-security
    runs-on: ubuntu-latest

    steps:
      - name: checkout rep
        uses: actions/checkout@v4

      - name: set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - name: sast
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/react
            p/security-audit

      - name: dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  deploy:
    name: stage-3-deploy
    runs-on: ubuntu-latest
    needs: [ci, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: checkout rep
        uses: actions/checkout@v4

      - name: set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: pull settings
        run: npx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: build
        run: npx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: deploy built
        run: npx vercel@latest deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
